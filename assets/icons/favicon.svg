<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="linkshow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141419"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bg-grad)" stroke="url(#linkshow-grad)" stroke-width="16" filter="url(#glow)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="40" y="40" width="432" height="432" rx="112" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="8"/>

  <!-- Link Network & Monogram 'T' Symbol -->
  <g transform="translate(256, 256)">
    <!-- Interconnected Node Ring -->
    <path d="M-110 -70 L110 -70 A20 20 0 0 1 110 -30 L25 -30 A10 10 0 0 0 15 -20 L15 110 A20 20 0 0 1 -15 110 L-15 -20 A10 10 0 0 0 -25 -30 L-110 -30 A20 20 0 0 1 -110 -70 Z" fill="url(#linkshow-grad)" filter="url(#glow)"/>

    <!-- Glowing Link Nodes -->
    <circle cx="-90" cy="-50" r="22" fill="#ffffff"/>
    <circle cx="90" cy="-50" r="22" fill="#ffffff"/>
    <circle cx="0" cy="90" r="22" fill="#ffffff"/>

    <circle cx="-90" cy="-50" r="12" fill="#ef4444"/>
    <circle cx="90" cy="-50" r="12" fill="#f43f5e"/>
    <circle cx="0" cy="90" r="12" fill="#8b5cf6"/>
  </g>
</svg>
